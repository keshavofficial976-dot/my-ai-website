<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio &amp; Desktop Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; height: 100vh; background: #0f172a; color: #f8fafc; overflow: hidden; }
    .sidebar { width: 420px; min-width: 340px; background: #1e293b; border-right: 1px solid #334155; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.1rem; color: #818cf8; }
    .mode-tabs { display: flex; gap: 6px; background: #0f172a; padding: 4px; border-radius: 8px; }
    .tab { flex: 1; padding: 8px; border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; background: transparent; color: #94a3b8; }
    .tab.active { background: #4f46e5; color: #fff; }
    .owner-row { display: flex; gap: 6px; }
    .owner-row input { flex: 1; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 7px 10px; border-radius: 6px; font-size: 0.78rem; outline: none; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { background: #334155; color: #e2e8f0; border: none; padding: 5px 9px; border-radius: 6px; font-size: 0.73rem; cursor: pointer; }
    .chip:hover { background: #475569; }
    .chat-box { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 0.83rem; line-height: 1.5; }
    .msg { padding: 9px 12px; border-radius: 10px; max-width: 94%; word-wrap: break-word; }
    .msg-user { align-self: flex-end; background: #4f46e5; color: #fff; }
    .msg-ai { align-self: flex-start; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
    .qa-badge { display: inline-block; margin-top: 6px; font-size: 0.72rem; background: #064e3b; color: #6ee7b7; padding: 2px 7px; border-radius: 4px; }
    .step-card { background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 10px; margin-top: 6px; }
    .step-btn { margin-top: 6px; background: #10b981; color: #fff; border: none; padding: 5px 10px; border-radius: 5px; font-size: 0.76rem; font-weight: 600; cursor: pointer; }
    .input-area { display: flex; flex-direction: column; gap: 8px; }
    textarea { width: 100%; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 10px; border-radius: 8px; font-size: 0.86rem; outline: none; resize: none; }
    .actions { display: flex; gap: 8px; }
    .btn { padding: 10px 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.84rem; cursor: pointer; }
    .btn-sec { background: #334155; color: #fff; flex: 1; }
    .btn-sec:hover { background: #475569; }
    .btn-send { background: #4f46e5; color: #fff; flex: 2; }
    .btn-send:hover { background: #4338ca; }
    .btn-send:disabled { opacity: 0.6; cursor: wait; }
    .main { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    .topbar { height: 52px; background: #1e293b; border-bottom: 1px solid #334155; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
    .top-btns { display: flex; gap: 8px; }
    .btn-top { background: #334155; color: #fff; border: none; padding: 7px 12px; border-radius: 7px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .btn-dl { background: #10b981; }
    iframe { flex: 1; width: 100%; border: none; background: #fff; }
    .console-view { flex: 1; background: #020617; color: #38bdf8; padding: 20px; font-family: monospace; font-size: 0.85rem; overflow-y: auto; display: none; white-space: pre-wrap; }
    @media (max-width: 768px) { body { flex-direction: column; overflow: auto; height: auto; } .sidebar { width: 100%; height: 65vh; } .main { height: 65vh; } }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="header">
      <h1>AI Studio &amp; Agent</h1>
      <span style="font-size:0.72rem;color:#34d399;">● Maker-Checker Active</span>
    </div>

    <div class="mode-tabs">
      <button id="tabWeb" class="tab active" type="button">Website Builder</button>
      <button id="tabAgent" class="tab" type="button">Desktop &amp; Code Agent</button>
    </div>

    <div class="owner-row" id="ownerRow">
      <input id="ownerEmail" type="email" placeholder="Your Email (for orders)">
      <input id="ownerWhatsapp" type="tel" placeholder="WhatsApp No.">
    </div>

    <div class="chips" id="webChips">
      <button class="chip" type="button" data-prompt="Build a live crypto and gold investment dashboard fetching real-time prices">Live Finance/Gold</button>
      <button class="chip" type="button" data-prompt="Build a modern bakery website with menu and order form">Bakery</button>
      <button class="chip" type="button" data-prompt="Build a travel agency website with 6D/5N packages">Travel</button>
    </div>

    <div class="chips" id="agentChips" style="display:none;">
      <button class="chip" type="button" data-prompt="Open Notepad and type Hello from my AI Agent">Open Notepad &amp; Type</button>
      <button class="chip" type="button" data-prompt="Create a Python script hello.py that prints system info and run it">Build &amp; Run Script</button>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg msg-ai">Hi! Switch between <b>Website Builder</b> (with live Google Search data) and <b>Desktop &amp; Code Agent</b> (to control Windows apps and build files) above!</div>
    </div>

    <div class="input-area">
      <div id="imgPreviewBar" style="display:none;align-items:center;justify-content:space-between;background:#0f172a;border:1px solid #475569;padding:6px 10px;border-radius:8px;font-size:0.78rem;color:#a5b4fc;">
        <span id="imgFileName">Photo attached</span>
        <button id="clearImgBtn" type="button" style="background:none;border:none;color:#f87171;cursor:pointer;font-weight:bold;">Remove</button>
      </div>
      <input type="file" id="imgInput" accept="image/*" style="display:none;">
      <textarea id="prompt" rows="2" placeholder="Describe a website or desktop task..."></textarea>
      <div class="actions">
        <button id="photoBtn" class="btn btn-sec" type="button">+ Photo</button>
        <button id="micBtn" class="btn btn-sec" type="button">Speak</button>
        <button id="sendBtn" class="btn btn-send" type="button">Send</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <span id="panelTitle" style="font-size:0.88rem;color:#cbd5e1;font-weight:600;">Live Website Preview</span>
      <div class="top-btns">
        <button id="resetBtn" class="btn-top" type="button">New</button>
        <button id="dlBtn" class="btn-top btn-dl" type="button">Download HTML</button>
      </div>
    </div>
    <iframe id="preview" srcdoc="<html><body style='font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#475569;background:#f8fafc'><div style='text-align:center;padding:20px'><h2>Ready to Build</h2><p>Use Website Builder for live-data sites, or switch to Desktop &amp; Code Agent to automate tasks!</p></div></body></html>"></iframe>
    <div id="consoleView" class="console-view">Agent Execution Log Ready...</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      let mode = 'web';
      let currentCode = '';
      let chatHistory = [];
      let selectedImgData = '';
      let selectedImgMime = '';

      const tabWeb = document.getElementById('tabWeb');
      const tabAgent = document.getElementById('tabAgent');
      const ownerRow = document.getElementById('ownerRow');
      const webChips = document.getElementById('webChips');
      const agentChips = document.getElementById('agentChips');
      const preview = document.getElementById('preview');
      const consoleView = document.getElementById('consoleView');
      const panelTitle = document.getElementById('panelTitle');
      const promptBox = document.getElementById('prompt');
      const chatBox = document.getElementById('chatBox');
      const sendBtn = document.getElementById('sendBtn');
      const micBtn = document.getElementById('micBtn');
      const photoBtn = document.getElementById('photoBtn');
      const imgInput = document.getElementById('imgInput');
      const clearImgBtn = document.getElementById('clearImgBtn');
      const resetBtn = document.getElementById('resetBtn');
      const dlBtn = document.getElementById('dlBtn');

      function switchMode(newMode) {
        mode = newMode;
        tabWeb.className = mode === 'web' ? 'tab active' : 'tab';
        tabAgent.className = mode === 'agent' ? 'tab active' : 'tab';
        ownerRow.style.display = mode === 'web' ? 'flex' : 'none';
        webChips.style.display = mode === 'web' ? 'flex' : 'none';
        agentChips.style.display = mode === 'agent' ? 'flex' : 'none';
        preview.style.display = mode === 'web' ? 'block' : 'none';
        consoleView.style.display = mode === 'agent' ? 'block' : 'none';
        panelTitle.textContent = mode === 'web' ? 'Live Website Preview' : 'Desktop & Code Agent Log';
      }

      tabWeb.addEventListener('click', function() { switchMode('web'); });
      tabAgent.addEventListener('click', function() { switchMode('agent'); });

      document.querySelectorAll('.chip').forEach(function(chip) {
        chip.addEventListener('click', function() {
          promptBox.value = chip.getAttribute('data-prompt') || '';
          sendMessage();
        });
      });

      photoBtn.addEventListener('click', function() { imgInput.click(); });

      imgInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function() {
          const parts = reader.result.split(',');
          selectedImgMime = file.type || 'image/png';
          selectedImgData = parts[1];
          document.getElementById('imgFileName').textContent = file.name;
          document.getElementById('imgPreviewBar').style.display = 'flex';
        };
        reader.readAsDataURL(file);
      });

      function clearImage() {
        selectedImgData = '';
        selectedImgMime = '';
        imgInput.value = '';
        document.getElementById('imgPreviewBar').style.display = 'none';
      }
      clearImgBtn.addEventListener('click', clearImage);

      micBtn.addEventListener('click', function() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          alert('Voice dictation works in Google Chrome or Microsoft Edge.');
          return;
        }
        const rec = new SR();
        micBtn.textContent = 'Listening...';
        rec.onresult = function(e) {
          promptBox.value = e.results[0][0].transcript;
        };
        rec.onerror = function(e) {
          alert('Mic error: ' + e.error + '. Please allow microphone access in Chrome.');
        };
        rec.onend = function() {
          micBtn.textContent = 'Speak';
        };
        rec.start();
      });

      resetBtn.addEventListener('click', function() { location.reload(); });

      dlBtn.addEventListener('click', function() {
        if (!currentCode) {
          alert('Create a website first!');
          return;
        }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([currentCode], { type: 'text/html' }));
        a.download = 'my-website.html';
        a.click();
      });

      function appendMsg(role, text, badgeText) {
        const div = document.createElement('div');
        div.className = 'msg ' + (role === 'user' ? 'msg-user' : 'msg-ai');
        div.textContent = text;
        if (badgeText) {
          const badge = document.createElement('div');
          badge.className = 'qa-badge';
          badge.textContent = 'Checked by: ' + badgeText;
          div.appendChild(document.createElement('br'));
          div.appendChild(badge);
        }
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        chatHistory.push({ role: role, text: text });
      }

      function appendAgentSteps(steps) {
        steps.forEach(function(step) {
          const card = document.createElement('div');
          card.className = 'step-card';
          const title = document.createElement('div');
          title.textContent = step.description || (step.action + ': ' + step.target);
          const btn = document.createElement('button');
          btn.className = 'step-btn';
          btn.type = 'button';
          btn.textContent = 'Approve & Run';
          btn.addEventListener('click', async function() {
            btn.disabled = true;
            btn.textContent = 'Running...';
            try {
              const res = await fetch('/api/agent/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(step)
              });
              const data = await res.json();
              consoleView.textContent += '\n> ' + step.action + ' (' + step.target + ')\n' + data.output + '\n';
              btn.textContent = data.ok ? 'Done' : 'Failed';
            } catch (err) {
              btn.textContent = 'Error';
            }
          });
          card.appendChild(title);
          card.appendChild(btn);
          chatBox.appendChild(card);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      async function sendMessage() {
        const text = promptBox.value.trim();
        if (!text && !selectedImgData) return;

        promptBox.value = '';
        appendMsg('user', (selectedImgData ? '[Photo attached] ' : '') + (text || 'Build or update based on this photo.'));
        sendBtn.disabled = true;
        sendBtn.textContent = 'Working...';

        try {
          if (mode === 'web') {
            const imgSnap = selectedImgData;
            const mimeSnap = selectedImgMime;
            clearImage();
            const res = await fetch('/api/generate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                message: text || 'Build or update the website based on this attached image.',
                history: chatHistory,
                current_code: currentCode,
                owner_email: document.getElementById('ownerEmail').value,
                owner_whatsapp: document.getElementById('ownerWhatsapp').value,
                image_data: imgSnap,
                image_mime: mimeSnap
              })
            });
            if (res.ok) {
          if (step.action === 'write_file') {
            const a = document.createElement('a');
            a.href = '/api/download/' + encodeURIComponent(step.target);
            a.download = step.target;
            a.click();
          }
              const data = await res.json();
              appendMsg('ai', data.reply, data.verified_by);
              if (data.html) {
                currentCode = data.html;
                preview.srcdoc = data.html;
              }
            } else {
              appendMsg('ai', 'AI server is busy right now—please try again.');
            }
          } else {
            const res = await fetch('/api/agent/plan', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ task: text, history: chatHistory })
            });
            if (res.ok) {
              const data = await res.json();
              appendMsg('ai', data.reply, data.verified_by);
              if (data.steps && data.steps.length) {
                appendAgentSteps(data.steps);
              }
            } else {
              appendMsg('ai', 'Could not create automation plan—please retry.');
            }
          }
        } catch (err) {
          appendMsg('ai', 'Connection error—make sure your server is running.');
        }

        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';
      }

      sendBtn.addEventListener('click', sendMessage);
      promptBox.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    });
  
    async function runBackupBrain() {
      const btn = document.getElementById('selfUpgradeBtn');
      btn.disabled = true;
      btn.textContent = 'Auditing...';
      try {
        const res = await fetch('/api/agent/self_upgrade', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ instruction: 'Inspect the app UI and capabilities, spot any missing buttons or workflows, and upgrade automatically if needed.' })
        });
        const data = await res.json();
        alert('Backup Brain Diagnosis:
' + data.diagnosis + '

Updated file: ' + data.updated_file);
        if (data.updated_file === 'index.html') location.reload();
      } catch (e) {
        alert('Backup Brain audit error: ' + e);
      }
      btn.disabled = false;
      btn.textContent = 'Backup Brain Audit';
    }
    </script>
</body>
</html>
