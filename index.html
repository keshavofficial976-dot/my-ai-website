<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Website Builder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; height: 100vh; background: #0f172a; color: #f8fafc; overflow: hidden; }
    .sidebar { width: 360px; min-width: 320px; background: #1e293b; border-right: 1px solid #334155; padding: 24px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.25rem; color: #818cf8; }
    .key-link { font-size: 0.75rem; background: #334155; color: #a5b4fc; text-decoration: none; padding: 6px 10px; border-radius: 6px; }
    label { font-size: 0.8rem; color: #94a3b8; display: block; margin-bottom: 6px; font-weight: 600; }
    input, textarea { width: 100%; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; outline: none; }
    input:focus, textarea:focus { border-color: #6366f1; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .chip { background: #334155; color: #e2e8f0; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; }
    .chip:hover { background: #475569; }
    .actions { display: flex; gap: 10px; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
    .btn-mic { background: #334155; color: #fff; }
    .btn-mic:hover { background: #475569; }
    .btn-create { flex: 2; background: #4f46e5; color: #fff; }
    .btn-create:hover { background: #4338ca; }
    .btn-create:disabled { opacity: 0.6; cursor: wait; }
    #status { font-size: 0.82rem; color: #38bdf8; min-height: 20px; }
    .main { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    .topbar { height: 56px; background: #1e293b; border-bottom: 1px solid #334155; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }
    .btn-download { background: #10b981; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
    .btn-download:hover { background: #059669; }
    iframe { flex: 1; width: 100%; border: none; background: #fff; }
    @media (max-width: 768px) { body { flex-direction: column; overflow: auto; height: auto; } .sidebar { width: 100%; } .main { height: 80vh; } }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="header">
      <h1>AI Website Builder</h1>
      <a href="https://google.com" target="_blank" class="key-link">Get Free Key</a>
    </div>
    <div>
      <label>1. Paste Your Gemini API Key</label>
      <input id="apiKey" type="password" placeholder="AIzaSy...">
    </div>
    <div>
      <label>2. Pick a Quick Idea or Describe Yours</label>
      <div class="chips">
        <button class="chip" onclick="setPrompt('Build a modern bakery website with menu items, photos, and an order form')">Bakery</button>
        <button class="chip" onclick="setPrompt('Build a clean personal portfolio website with projects and contact form')">Portfolio</button>
        <button class="chip" onclick="setPrompt('Build a fitness gym landing page with membership pricing and trainer cards')">Fitness Gym</button>
      </div>
      <textarea id="prompt" rows="4" placeholder="Speak or type what website you want..."></textarea>
    </div>
    <div class="actions">
      <button id="micBtn" class="btn btn-mic" onclick="startVoice()">Speak</button>
      <button id="genBtn" class="btn btn-create" onclick="generateSite()">Create Website</button>
    </div>
    <p id="status"></p>
  </div>

  <div class="main">
    <div class="topbar">
      <span>Live Website Preview</span>
      <button class="btn-download" onclick="downloadSite()">Download Website</button>
    </div>
    <iframe id="preview" srcdoc="<html><body style='font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#475569;background:#f8fafc'><div style='text-align:center;padding:20px'><h2>Your Website Will Appear Here</h2><p>1. Paste your free Gemini API key on the left<br>2. Click Bakery (or Speak/Type your idea)<br>3. Click Create Website</p></div></body></html>"></iframe>
  </div>

  <script>
    const keyInput = document.getElementById('apiKey');
    keyInput.value = localStorage.getItem('gemini_key') || '';
    keyInput.addEventListener('input', () => localStorage.setItem('gemini_key', keyInput.value.trim()));
    let currentCode = '';

    function setPrompt(text) {
      document.getElementById('prompt').value = text;
    }

    function startVoice() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert('Voice dictation works best in Chrome or Edge.');
      const rec = new SR();
      const btn = document.getElementById('micBtn');
      btn.textContent = 'Listening...';
      rec.onresult = (e) => {
        document.getElementById('prompt').value = e.results[0][0].transcript;
      };
      rec.onend = () => {
        btn.textContent = 'Speak';
      };
      rec.start();
    }

    async function generateSite() {
      const key = keyInput.value.trim();
      const userPrompt = document.getElementById('prompt').value.trim();
      const status = document.getElementById('status');
      const btn = document.getElementById('genBtn');
      if (key.length < 20) return alert('That does not look like a Gemini key! A Gemini key always starts with AIzaSy... (from ://google.com).');
      if (!userPrompt) return alert('Please speak or type what website you want.');

      btn.disabled = true;
      btn.textContent = 'Building...';
      status.textContent = 'Creating your website...';

      const instruction = 'Return ONLY raw valid single-file HTML with clean internal CSS styling. No markdown backticks, no explanations. ' +
        (currentCode ? 'Update this existing HTML: ' + currentCode + ' based on: ' : 'Create a complete responsive modern website for: ') + userPrompt;

      const models = ['gemini-3.5-flash-lite', 'gemini-3.8-flash', 'gemini-3.6-flash'];
      for (const m of models) {
        try {
          const res = await fetch('https://googleapis.com' + m + ':generateContent?key=' + key, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: instruction }] }] })
          });
          if (!res.ok) { const t = await res.text(); status.textContent = m + ': ' + t; continue; }
          const data = await res.json();
          let raw = data.candidates[0].content.parts[0].text;
          raw = raw.replace(/^```html\s*/i, '').replace(/```$/i, '').trim();
          currentCode = raw;
          document.getElementById('preview').srcdoc = raw;
          status.textContent = 'Done! Type more changes to edit it, or click Download Website.';
          btn.disabled = false;
          btn.textContent = 'Update Website';
          return;
        } catch (e) { status.textContent = e.message; }
      }

      status.textContent = 'Could not connect. Check your API key and try again.';
      btn.disabled = false;
      btn.textContent = 'Create Website';
    }

    function downloadSite() {
      if (!currentCode) return alert('Create a website first!');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([currentCode], { type: 'text/html' }));
      a.download = 'my-website.html';
      a.click();
    }
  </script>
</body>
</html>
