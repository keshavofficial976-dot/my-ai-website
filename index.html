<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Studio & Desktop Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; height: 100vh; background: #0f172a; color: #f8fafc; overflow: hidden; }
    .sidebar { width: 390px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
    .brand { padding: 16px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .brand h2 { font-size: 17px; color: #818cf8; }
    .badge { font-size: 11px; background: #064e3b; color: #34d399; padding: 3px 8px; border-radius: 99px; }
    .modes { display: flex; padding: 8px; gap: 6px; background: #0f172a; }
    .mode-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; background: transparent; color: #94a3b8; cursor: pointer; font-weight: 600; font-size: 13px; }
    .mode-btn.active { background: #4f46e5; color: #fff; }
    .chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 11px 13px; border-radius: 12px; font-size: 13.5px; line-height: 1.45; max-width: 92%; white-space: pre-wrap; word-break: break-word; }
    .msg.user { background: #4f46e5; color: #fff; align-self: flex-end; }
    .msg.ai { background: #334155; color: #f1f5f9; align-self: flex-start; }
    .step-card { background: #0f172a; border: 1px solid #475569; border-radius: 10px; padding: 10px; margin-top: 6px; }
    .step-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #38bdf8; font-weight: 600; gap: 8px; }
    .btn-app { background: #10b981; color: #fff; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
    .composer { padding: 12px; border-top: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
    textarea { width: 100%; height: 74px; background: #0f172a; border: 1px solid #475569; border-radius: 10px; color: #fff; padding: 10px; resize: none; font-size: 13.5px; }
    .controls { display: flex; gap: 6px; }
    .btn { padding: 9px 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-sec { background: #334155; color: #e2e8f0; }
    .btn-send { background: #4f46e5; color: #fff; flex: 2; }
    .btn-send:disabled { opacity: 0.6; cursor: wait; }
    .btn-stop { background: #dc2626; color: #fff; flex: 1; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { height: 52px; background: #1e293b; border-bottom: 1px solid #334155; padding: 0 18px; display: flex; justify-content: space-between; align-items: center; }
    .top-btns { display: flex; gap: 8px; }
    .btn-dl { background: #10b981; color: #fff; border: none; padding: 7px 13px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
    iframe { flex: 1; width: 100%; border: none; background: #fff; }
    #agentLog { flex: 1; padding: 20px; background: #020617; color: #38bdf8; font-family: monospace; font-size: 13px; overflow-y: auto; white-space: pre-wrap; display: none; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="brand">
      <h2>AI Studio & Agent</h2>
      <span class="badge" id="statusBadge">Connecting...</span>
    </div>
    <div class="modes">
      <button id="webModeBtn" class="mode-btn active" type="button">Website Builder</button>
      <button id="agentModeBtn" class="mode-btn" type="button">Desktop & Code Agent</button>
    </div>
    <div class="chat" id="chatBox">
      <div class="msg ai">Hi! Switch between <b>Website Builder</b> and <b>Desktop & Code Agent</b> above, type your prompt, and click <b>Send</b>. Click <b>Stop</b> anytime to cancel immediately.</div>
    </div>
    <div class="composer">
      <textarea id="promptBox" placeholder="Describe a website or desktop agent..."></textarea>
      <div class="controls">
        <input type="file" id="imgInput" accept="image/*" style="display:none" />
        <button id="photoBtn" class="btn btn-sec" type="button">+ Photo</button>
        <button id="sendBtn" class="btn btn-send" type="button">Send</button>
        <button id="stopBtn" class="btn btn-stop" type="button">Stop</button>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <span id="viewTitle" style="font-size:13.5px;color:#cbd5e1;font-weight:600;">Live Website Preview</span>
      <div class="top-btns">
        <button id="downloadAgentBtn" class="btn-dl" style="background:#6366f1;display:none;" type="button">Download Agent</button>
        <button id="newBtn" class="btn-dl" style="background:#334155;" type="button">New</button>
        <button id="downloadHtmlBtn" class="btn-dl" type="button">Download HTML</button>
      </div>
    </div>
    <iframe id="previewFrame"></iframe>
    <div id="agentLog">Agent Execution Log Ready...</div>
  </div>

  <script>
    let mode = 'web';
    let history = [];
    let currentCode = '';
    let lastAgentFile = '';
    let imgData = '';
    let imgMime = '';
    let abortCtrl = null;

    function setMode(m) {
      mode = m;
      document.getElementById('webModeBtn').classList.toggle('active', m === 'web');
      document.getElementById('agentModeBtn').classList.toggle('active', m === 'agent');
      document.getElementById('previewFrame').style.display = m === 'web' ? 'block' : 'none';
      document.getElementById('agentLog').style.display = m === 'agent' ? 'block' : 'none';
      document.getElementById('viewTitle').textContent = m === 'web' ? 'Live Website Preview' : 'Desktop & Code Agent Log';
    }

    function appendMsg(role, text) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    function forceStopNow() {
      if (abortCtrl) {
        try { abortCtrl.abort(); } catch (e) {}
        abortCtrl = null;
      }
      const btn = document.getElementById('sendBtn');
      btn.disabled = false;
      btn.textContent = 'Send';
      appendMsg('ai', 'Stopped. Ready for your next prompt.');
    }

    async function sendMessage() {
      const box = document.getElementById('promptBox');
      const text = box.value.trim();
      if (!text && !imgData) return;

      appendMsg('user', (imgData ? '[Photo] ' : '') + text);
      history.push({ role: 'user', text });
      box.value = '';

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      btn.textContent = 'Working...';

      if (abortCtrl) { try { abortCtrl.abort(); } catch (e) {} }
      abortCtrl = new AbortController();
      const timer = setTimeout(() => { if (abortCtrl) abortCtrl.abort(); }, 25000);

      try {
        const url = mode === 'web' ? '/api/generate' : '/api/agent/plan';
        const payload = mode === 'web'
          ? { message: text, history, current_code: currentCode, image_data: imgData, image_mime: imgMime }
          : { task: text, history };
        imgData = ''; imgMime = '';

        const res = await fetch(url, {
          method: 'POST',
          signal: abortCtrl.signal,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        clearTimeout(timer);

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          appendMsg('ai', 'Server error (' + res.status + '): ' + (data.detail || 'Try again'));
        } else if (mode === 'web') {
          appendMsg('ai', (data.reply || 'Updated!') + (data.checker ? '\n[' + data.checker + ']' : ''));
          history.push({ role: 'ai', text: data.reply || '' });
          if (data.html) {
            currentCode = data.html;
            document.getElementById('previewFrame').srcdoc = currentCode;
          }
        } else {
          const bubble = appendMsg('ai', (data.reply || 'Plan ready.') + (data.checker ? '\n[' + data.checker + ']' : ''));
          history.push({ role: 'ai', text: data.reply || '' });
          (data.steps || []).forEach(step => {
            const card = document.createElement('div');
            card.className = 'step-card';
            card.innerHTML = '<div class="step-head"><span>' + step.action + ': ' + step.target + '</span><button class="btn-app" type="button">Approve & Download</button></div>';
            card.querySelector('button').onclick = async function () {
              this.disabled = true;
              this.textContent = 'Running...';
              const r = await fetch('/api/agent/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(step)
              });
              const out = await r.json();
              const log = document.getElementById('agentLog');
              log.textContent += '\n> ' + step.action + ' (' + step.target + ')\n' + out.output + '\n';
              this.textContent = out.ok ? 'Done' : 'Info';
              if (out.ok && step.action === 'write_file') {
                lastAgentFile = step.target;
                const dl = document.getElementById('downloadAgentBtn');
                dl.style.display = 'inline-block';
                dl.textContent = 'Download ' + step.target;
                window.location.href = '/api/download/' + encodeURIComponent(step.target);
              }
            };
            bubble.appendChild(card);
          });
        }
      } catch (err) {
        clearTimeout(timer);
        if (err.name !== 'AbortError') {
          appendMsg('ai', 'Network/Timeout: ' + (err.message || err));
        }
      } finally {
        btn.disabled = false;
