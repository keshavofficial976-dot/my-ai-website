<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>AI Studio v2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{display:flex;height:100vh;background:#0f172a;color:#f8fafc}
.side{width:380px;background:#1e293b;border-right:1px solid #334155;display:flex;flex-direction:column}
.top{padding:14px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:11px;background:#064e3b;color:#34d399;padding:3px 8px;border-radius:99px}
.tabs{display:flex;padding:8px;gap:6px;background:#0f172a}
.tab{flex:1;padding:8px;border:none;border-radius:8px;background:transparent;color:#94a3b8;cursor:pointer;font-weight:600}
.tab.active{background:#4f46e5;color:#fff}
.chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.4;max-width:92%;white-space:pre-wrap;word-break:break-word}
.user{background:#4f46e5;align-self:flex-end}.ai{background:#334155;align-self:flex-start}
.card{background:#0f172a;border:1px solid #475569;border-radius:8px;padding:8px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#38bdf8}
.comp{padding:10px;border-top:1px solid #334155;display:flex;flex-direction:column;gap:6px}
textarea{width:100%;height:70px;background:#0f172a;border:1px solid #475569;border-radius:8px;color:#fff;padding:8px;resize:none}
.row{display:flex;gap:6px}
button{padding:8px 12px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.main{flex:1;display:flex;flex-direction:column}
iframe{flex:1;border:none;background:#fff}
#log{flex:1;padding:18px;background:#020617;color:#38bdf8;font-family:monospace;white-space:pre-wrap;display:none;overflow-y:auto}
</style></head><body>
<div class="side">
  <div class="top"><h3 style="color:#818cf8">AI Studio v2</h3><span class="badge" id="st">Connecting...</span></div>
  <div class="tabs"><button id="tWeb" class="tab active" type="button">Website Builder</button><button id="tAg" class="tab" type="button">Desktop & Code Agent</button></div>
  <div class="chat" id="chat"><div class="msg ai">Ready! Pick a tab above, enter your prompt, and click Send.</div></div>
  <div class="comp">
    <textarea id="inp" placeholder="Describe a website or desktop agent..."></textarea>
    <div class="row">
      <button id="sendBtn" style="background:#4f46e5;color:#fff;flex:2" type="button">Send</button>
      <button id="stopBtn" style="background:#dc2626;color:#fff;flex:1" type="button">Stop</button>
    </div>
  </div>
</div>
<div class="main">
  <div class="top"><span id="ttl">Live Website Preview</span><div class="row"><button id="dlAg" style="background:#6366f1;color:#fff;display:none" type="button">Download Agent</button><button id="dlHtml" style="background:#10b981;color:#fff" type="button">Download HTML</button></div></div>
  <iframe id="frm"></iframe><div id="log">Agent Execution Log Ready...</div>
</div>
<script>
var mode='web',hist=[],code='',agFile='',ctrl=null;
function setMode(m){mode=m;document.getElementById('tWeb').className=m==='web'?'tab active':'tab';document.getElementById('tAg').className=m==='agent'?'tab active':'tab';document.getElementById('frm').style.display=m==='web'?'block':'none';document.getElementById('log').style.display=m==='agent'?'block':'none';document.getElementById('ttl').textContent=m==='web'?'Live Website Preview':'Desktop & Code Agent Log';}
function addMsg(r,t){var c=document.getElementById('chat'),d=document.createElement('div');d.className='msg '+r;d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight;return d;}
function stopAll(){if(ctrl){try{ctrl.abort()}catch(e){}ctrl=null}var b=document.getElementById('sendBtn');b.disabled=false;b.textContent='Send';addMsg('ai','Stopped.');}
async function run(){
  var inp=document.getElementById('inp'),t=inp.value.trim();if(!t)return;
  addMsg('user',t);hist.push({role:'user',text:t});inp.value='';
  var b=document.getElementById('sendBtn');b.disabled=true;b.textContent='Working...';
  ctrl=new AbortController();var tm=setTimeout(function(){if(ctrl)ctrl.abort()},22000);
  try{
    var r=await fetch(mode==='web'?'/api/generate':'/api/agent/plan',{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify(mode==='web'?{message:t,history:hist,current_code:code}:{task:t,history:hist})});
    clearTimeout(tm);var d=await r.json().catch(function(){return{}});
    if(!r.ok){addMsg('ai','Error '+r.status+': '+(d.detail||'Retry'));}
    else if(mode==='web'){addMsg('ai',d.reply||'Done');hist.push({role:'ai',text:d.reply||''});if(d.html){code=d.html;document.getElementById('frm').srcdoc=code;}}
    else{
      var bub=addMsg('ai',d.reply||'Plan ready');hist.push({role:'ai',text:d.reply||''});
      (d.steps||[]).forEach(function(s){
        var card=document.createElement('div');card.className='card';
        var sp=document.createElement('span');sp.textContent=s.action+': '+s.target;
        var ab=document.createElement('button');ab.style.cssText='background:#10b981;color:#fff;padding:4px 9px';ab.textContent='Approve';
        ab.onclick=async function(){
          ab.disabled=true;ab.textContent='...';
          var er=await fetch('/api/agent/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(s)});
          var eo=await er.json();document.getElementById('log').textContent+='\n> '+s.target+'\n'+eo.output+'\n';ab.textContent='Done';
          if(eo.ok&&s.action==='write_file'){agFile=s.target;var da=document.getElementById('dlAg');da.style.display='inline-block';da.textContent='Download '+s.target;window.location.href='/api/download/'+encodeURIComponent(s.target);}
        };
        card.appendChild(sp);card.appendChild(ab);bub.appendChild(card);
      });
    }
  }catch(e){clearTimeout(tm);if(e.name!=='AbortError')addMsg('ai','Timeout/Net: '+(e.message||e));}
  finally{b.disabled=false;b.textContent='Send';ctrl=null;}
}
document.getElementById('tWeb').onclick=function(){setMode('web')};
document.getElementById('tAg').onclick=function(){setMode('agent')};
document.getElementById('sendBtn').onclick=run;
document.getElementById('stopBtn').onclick=stopAll;
document.getElementById('dlHtml').onclick=function(){if(!code)return;var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code],{type:'text/html'}));a.download='site.html';a.click();};
document.getElementById('dlAg').onclick=function(){if(agFile)window.location.href='/api/download/'+encodeURIComponent(agFile);};
fetch('/api/health').then(function(r){return r.json()}).then(function(d){document.getElementById('st').textContent=d.groq?'Live':'Online'}).catch(function(){document.getElementById('st').textContent='Offline'});
</script></body></html>
