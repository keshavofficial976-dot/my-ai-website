<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Website Builder</title>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white h-screen flex flex-col md:flex-row overflow-hidden font-sans">
  <div class="w-full md:w-1/3 bg-slate-900 border-r border-slate-800 p-6 flex flex-col gap-4 overflow-y-auto">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-bold text-indigo-400">AI Website Builder</h1>
      <a href="https://google.com" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-indigo-300">Get Free Key</a>
    </div>
    <div>
      <label class="text-xs text-slate-400 block mb-1">1. Paste Your Gemini API Key</label>
      <input id="apiKey" type="password" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
    </div>
    <div>
      <label class="text-xs text-slate-400 block mb-1">2. Pick a Quick Idea or Describe Yours</label>
      <div class="flex gap-2 mb-2 flex-wrap">
        <button onclick="setPrompt('Build a modern bakery website with menu items, photos, and an order form')" class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded-md">Bakery</button>
        <button onclick="setPrompt('Build a clean personal portfolio website with projects and contact form')" class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded-md">Portfolio</button>
        <button onclick="setPrompt('Build a fitness gym landing page with membership pricing and trainer cards')" class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded-md">Fitness Gym</button>
      </div>
      <textarea id="prompt" rows="4" placeholder="Speak or type what website you want..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500"></textarea>
    </div>
    <div class="flex gap-2">
      <button id="micBtn" onclick="startVoice()" class="flex-1 bg-slate-800 hover:bg-slate-700 py-2.5 rounded-lg text-sm font-medium">Speak</button>
      <button id="genBtn" onclick="generateSite()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 px-5 py-2.5 rounded-lg text-sm font-semibold">Create Website</button>
    </div>
    <p id="status" class="text-xs text-slate-400"></p>
  </div>

  <div class="w-full md:w-2/3 flex flex-col bg-slate-950 h-full">
    <div class="h-14 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900">
      <span class="text-sm text-slate-300 font-medium">Live Website Preview</span>
      <button onclick="downloadSite()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2 rounded-lg">Download Website</button>
    </div>
    <iframe id="preview" class="w-full flex-1 bg-white" srcdoc="<html><body style='font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#475569;background:#f8fafc'><div style='text-align:center'><h2>Your Website Will Appear Here</h2><p>Paste your free Gemini API key on the left and click Create Website.</p></div></body></html>"></iframe>
  </div>

  <script>
    const keyInput = document.getElementById('apiKey');
    keyInput.value = localStorage.getItem('gemini_key') || '';
    keyInput.addEventListener('input', () => localStorage.setItem('gemini_key', keyInput.value.trim()));
    let currentCode = '';

    function setPrompt(text) {
      document.getElementById('prompt').value = text;
    }

    function startVoice() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert('Voice dictation works best in Chrome or Edge.');
      const rec = new SR();
      const btn = document.getElementById('micBtn');
      btn.textContent = 'Listening...';
      rec.onresult = (e) => {
        document.getElementById('prompt').value = e.results[0][0].transcript;
      };
      rec.onend = () => {
        btn.textContent = 'Speak';
      };
      rec.start();
    }

    async function generateSite() {
      const key = keyInput.value.trim();
      const userPrompt = document.getElementById('prompt').value.trim();
      const status = document.getElementById('status');
      const btn = document.getElementById('genBtn');
      if (!key) return alert('Please paste your free Gemini API key first.');
      if (!userPrompt) return alert('Please speak or type what website you want.');

      btn.disabled = true;
      btn.textContent = 'Building...';
      status.textContent = 'Creating your website...';

      const instruction = 'Return ONLY raw valid single-file HTML using Tailwind CSS CDN. No markdown backticks, no explanations. ' +
        (currentCode ? 'Update this existing HTML: ' + currentCode + ' based on: ' : 'Create a complete responsive website for: ') + userPrompt;

      const models = ['gemini-3.5-flash-lite', 'gemini-3.8-flash', 'gemini-3.6-flash'];
      for (const m of models) {
        try {
          const res = await fetch('https://googleapis.com' + m + ':generateContent?key=' + key, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: instruction }] }] })
          });
          if (!res.ok) continue;
          const data = await res.json();
          let raw = data.candidates[0].content.parts[0].text;
          raw = raw.replace(/^```html\s*/i, '').replace(/```$/i, '').trim();
          currentCode = raw;
          document.getElementById('preview').srcdoc = raw;
          status.textContent = 'Done! Type more changes to edit it, or click Download Website.';
          btn.disabled = false;
          btn.textContent = 'Update Website';
          return;
        } catch (e) {}
      }

      status.textContent = 'Could not connect. Check your API key and try again.';
      btn.disabled = false;
      btn.textContent = 'Create Website';
    }

    function downloadSite() {
      if (!currentCode) return alert('Create a website first!');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([currentCode], { type: 'text/html' }));
      a.download = 'my-website.html';
      a.click();
    }
  </script>
</body>
</html>
