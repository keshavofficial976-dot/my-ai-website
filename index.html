<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Website Co-Pilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; height: 100vh; background: #0f172a; color: #f8fafc; overflow: hidden; }
    .sidebar { width: 400px; min-width: 340px; background: #1e293b; border-right: 1px solid #334155; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.15rem; color: #818cf8; }
    .owner-row { display: flex; gap: 6px; }
    .owner-row input { flex: 1; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 7px 10px; border-radius: 6px; font-size: 0.78rem; outline: none; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { background: #334155; color: #e2e8f0; border: none; padding: 5px 9px; border-radius: 6px; font-size: 0.74rem; cursor: pointer; }
    .chip:hover { background: #475569; }
    .chat-box { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 0.84rem; line-height: 1.5; }
    .msg { padding: 9px 12px; border-radius: 10px; max-width: 92%; word-wrap: break-word; }
    .msg-user { align-self: flex-end; background: #4f46e5; color: #fff; border-bottom-right-radius: 2px; }
    .msg-ai { align-self: flex-start; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-bottom-left-radius: 2px; }
    .input-area { display: flex; flex-direction: column; gap: 8px; }
    textarea { width: 100%; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 0.88rem; outline: none; resize: none; }
    textarea:focus { border-color: #6366f1; }
    .actions { display: flex; gap: 8px; }
    .btn { padding: 10px 14px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.86rem; cursor: pointer; }
    .btn-mic { background: #334155; color: #fff; flex: 1; }
    .btn-mic:hover { background: #475569; }
    .btn-send { background: #4f46e5; color: #fff; flex: 2; }
    .btn-send:hover { background: #4338ca; }
    .btn-send:disabled { opacity: 0.6; cursor: wait; }
    .main { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    .topbar { height: 54px; background: #1e293b; border-bottom: 1px solid #334155; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
    .top-btns { display: flex; gap: 8px; }
    .btn-reset { background: #334155; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    .btn-download { background: #10b981; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    iframe { flex: 1; width: 100%; border: none; background: #fff; }
    @media (max-width: 768px) { body { flex-direction: column; overflow: auto; height: auto; } .sidebar { width: 100%; height: 65vh; } .main { height: 70vh; } }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="header">
      <h1>AI Website Co-Pilot</h1>
      <span style="font-size:0.74rem;color:#34d399;">● Two-Way Live</span>
    </div>

    <div class="owner-row">
      <input id="ownerEmail" type="email" placeholder="Your Email (for orders)">
      <input id="ownerWhatsapp" type="tel" placeholder="WhatsApp No.">
    </div>

    <div class="chips">
      <button class="chip" onclick="quickSend('Build a modern bakery website with menu and order form')">Bakery</button>
      <button class="chip" onclick="quickSend('Build a travel agency website with 6D/5N packages')">Travel</button>
      <button class="chip" onclick="quickSend('What sections should I add to get more customers?')">Ask AI Ideas</button>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg msg-ai">Hi! Tell me what website you want to build, or ask me for design ideas—we can chat back and forth as I build and update your site on the right!</div>
    </div>

    <div class="input-area">
      <div id="imgPreviewBar" style="display:none;align-items:center;justify-content:space-between;background:#0f172a;border:1px solid #475569;padding:6px 10px;border-radius:8px;font-size:0.78rem;color:#a5b4fc;">
        <span id="imgFileName">Photo attached</span>
        <button onclick="clearImage()" style="background:none;border:none;color:#f87171;cursor:pointer;font-weight:bold;">✕ Remove</button>
      </div>
      <input type="file" id="imgInput" accept="image/*" style="display:none;" onchange="handleImage(event)">
      <textarea id="prompt" rows="2" placeholder="Chat with AI or say 'Change the menu' (Press Enter to send)..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
      <div class="actions">
        <button class="btn btn-mic" onclick="document.getElementById('imgInput').click()">+ Photo</button>
        <button id="micBtn" class="btn btn-mic" onclick="startVoice()">Speak</button>
        <button id="sendBtn" class="btn btn-send" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <span style="font-size:0.88rem;color:#cbd5e1;font-weight:600;">Live Website Preview</span>
      <div class="top-btns">
        <button class="btn-reset" onclick="location.reload()">New Site</button>
        <button class="btn-download" onclick="downloadSite()">Download Website</button>
      </div>
    </div>
    <iframe id="preview" srcdoc="<html><body style='font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#475569;background:#f8fafc'><div style='text-align:center;padding:20px'><h2>Your Live Website Preview</h2><p>Chat with the AI on the left—ask for ideas or tell it what to build!</p></div></body></html>"></iframe>
  </div>

  <script>
    let selectedImgData = '';
    let selectedImgMime = '';

    function handleImage(e) {
      const file = e.target.files.at(0);
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const parts = reader.result.split(',');
        selectedImgMime = file.type || 'image/png';
        selectedImgData = parts.at(1);
        document.getElementById('imgFileName').textContent = '📎 ' + file.name;
        document.getElementById('imgPreviewBar').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      selectedImgData = '';
      selectedImgMime = '';
      document.getElementById('imgInput').value = '';
      document.getElementById('imgPreviewBar').style.display = 'none';
    }

    let currentCode = '';
    let chatHistory = [];

    function appendMsg(role, text) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = 'msg ' + (role === 'user' ? 'msg-user' : 'msg-ai');
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      chatHistory.push({ role, text });
    }

    function quickSend(text) {
      document.getElementById('prompt').value = text;
      sendMessage();
    }

    function startVoice() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert('Voice dictation works best in Chrome or Edge.');
      const rec = new SR();
      const btn = document.getElementById('micBtn');
      btn.textContent = 'Listening...';
      rec.onresult = (e) => {
        document.getElementById('prompt').value = e.results.at(0).at(0).transcript;
      };
      rec.onend = () => { btn.textContent = 'Speak'; };
      rec.start();
    }

    async function sendMessage() {
      const box = document.getElementById('prompt');
      const text = box.value.trim();
      const btn = document.getElementById('sendBtn');
      if (!text && !selectedImgData) return;

      box.value = '';
      appendMsg('user', (selectedImgData ? '[Photo attached] ' : '') + (text || 'Please build/update based on this photo.'));
      btn.disabled = true;
      btn.textContent = 'Thinking...';

      try {
        const imgSnap = selectedImgData; clearImage(); const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text || 'Build or update the website based on this attached image.',
            history: chatHistory,
            current_code: currentCode,
            owner_email: document.getElementById('ownerEmail').value,
            owner_whatsapp: document.getElementById('ownerWhatsapp').value, image_data: selectedImgData, image_mime: selectedImgMime
          })
        });
        if (res.ok) {
          const data = await res.json();
          appendMsg('ai', data.reply);
          if (data.html) {
            currentCode = data.html;
            document.getElementById('preview').srcdoc = data.html;
          }
        } else {
          appendMsg('ai', 'Sorry, the AI server is busy right now—please try sending that again!');
        }
      } catch (e) {
        appendMsg('ai', 'Connection error—please check your internet and try again.');
      }

      btn.disabled = false;
      btn.textContent = 'Send';
    }

    function downloadSite() {
      if (!currentCode) return alert('Create a website first!');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([currentCode], { type: 'text/html' }));
      a.download = 'my-website.html';
      a.click();
    }
  </script>
</body>
</html>
